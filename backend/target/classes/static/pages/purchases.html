<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purchases \u2013 Vijayalakshmi Poultry Farm</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="purchases" data-title="Purchases">
  <div id="page-content">
    <div class="toolbar">
      <div class="filters">
        <label style="margin:0;">From</label>
        <input type="date" id="from-filter">
        <label style="margin:0;">To</label>
        <input type="date" id="to-filter">
        <button class="btn-outline btn-sm" id="apply-filter-btn">Filter</button>
      </div>
      <button class="btn-primary" id="add-purchase-btn">+ Record Purchase</button>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Date</th><th>Supplier</th><th>Birds</th><th>Boxes</th><th>Weight</th><th>Rate</th><th class="text-right">Amount</th><th></th></tr></thead>
        <tbody id="purchases-body"><tr><td colspan="8" class="table-empty">Loading...</td></tr></tbody>
      </table>
      <div class="summary-line total" id="total-line" style="display:none;"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="purchase-modal" style="display:none;">
    <div class="modal wide">
      <div class="modal-header">
        <h2>Record Purchase</h2>
        <button class="modal-close" data-close-modal="purchase-modal">&times;</button>
      </div>
      <div id="purchase-form-error"></div>
      <form id="purchase-form">
        <div class="field">
          <label>Supplier *</label>
          <select id="pu-supplier" required></select>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Purchase Date *</label>
            <input type="date" id="pu-date" required>
          </div>
          <div class="field">
            <label>Number of Birds</label>
            <input type="number" min="0" id="pu-birds">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Number of Boxes</label>
            <input type="number" min="0" id="pu-boxes">
          </div>
          <div class="field">
            <label>Purchase Weight (kg) *</label>
            <input type="number" step="0.01" min="0" id="pu-weight" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Purchase Rate (\u20b9/kg) *</label>
            <input type="number" step="0.01" min="0" id="pu-rate" required>
          </div>
          <div class="field">
            <label>Purchase Amount (auto \u2013 editable)</label>
            <input type="number" step="0.01" min="0" id="pu-amount">
          </div>
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="pu-notes" rows="2"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-outline" data-close-modal="purchase-modal">Cancel</button>
          <button type="submit" class="btn-primary" id="purchase-save-btn">Save Purchase</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/purchases.js"></script>
</body>
</html>
