<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier Account \u2013 Vijayalakshmi Poultry Farm</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="suppliers" data-title="Supplier Account">
  <div id="page-content">
    <div class="card" id="supplier-header-card">
      <div class="loading-row">Loading supplier...</div>
    </div>

    <div class="grid grid-3" id="supplier-stats"></div>

    <div class="card">
      <div class="toolbar" style="margin-bottom: 0;">
        <div class="section-tabs" id="tabs">
          <button data-tab="purchases" class="active">Purchase History</button>
          <button data-tab="payments">Payment History</button>
          <button data-tab="ledger">Ledger</button>
        </div>
        <div class="filters">
          <button class="btn-amber btn-sm" id="record-purchase-btn">+ Record Purchase</button>
          <button class="btn-amber btn-sm" id="record-payment-btn">+ Record Payment</button>
          <button class="btn-outline btn-sm" id="generate-pdf-btn">\ud83d\uddb6\ufe0f Generate Purchase PDF</button>
        </div>
      </div>

      <div id="tab-purchases">
        <table>
          <thead><tr><th>Date</th><th>Birds</th><th>Boxes</th><th>Weight</th><th>Rate</th><th class="text-right">Amount</th><th></th></tr></thead>
          <tbody id="purchases-body"><tr><td colspan="7" class="table-empty">Loading...</td></tr></tbody>
        </table>
      </div>

      <div id="tab-payments" style="display:none;">
        <table>
          <thead><tr><th>Date</th><th>Method</th><th>Reference</th><th class="text-right">Amount</th><th></th></tr></thead>
          <tbody id="payments-body"><tr><td colspan="5" class="table-empty">Loading...</td></tr></tbody>
        </table>
      </div>

      <div id="tab-ledger" style="display:none;">
        <table>
          <thead><tr><th>Date</th><th>Type</th><th class="text-right">Debit</th><th class="text-right">Credit</th><th class="text-right">Balance</th><th>Description</th></tr></thead>
          <tbody id="ledger-body"><tr><td colspan="6" class="table-empty">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Record Purchase Modal -->
  <div class="modal-backdrop" id="purchase-modal" style="display:none;">
    <div class="modal wide">
      <div class="modal-header">
        <h2>Record Purchase</h2>
        <button class="modal-close" data-close-modal="purchase-modal">&times;</button>
      </div>
      <div id="purchase-form-error"></div>
      <form id="purchase-form">
        <div class="field-row">
          <div class="field">
            <label>Purchase Date *</label>
            <input type="date" id="pu-date" required>
          </div>
          <div class="field">
            <label>Number of Birds</label>
            <input type="number" min="0" id="pu-birds">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Number of Boxes</label>
            <input type="number" min="0" id="pu-boxes">
          </div>
          <div class="field">
            <label>Purchase Weight (kg) *</label>
            <input type="number" step="0.01" min="0" id="pu-weight" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Purchase Rate (\u20b9/kg) *</label>
            <input type="number" step="0.01" min="0" id="pu-rate" required>
          </div>
          <div class="field">
            <label>Purchase Amount (auto \u2013 editable)</label>
            <input type="number" step="0.01" min="0" id="pu-amount">
          </div>
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="pu-notes" rows="2"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-outline" data-close-modal="purchase-modal">Cancel</button>
          <button type="submit" class="btn-primary" id="purchase-save-btn">Save Purchase</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Record Payment Modal -->
  <div class="modal-backdrop" id="payment-modal" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2>Record Payment to Supplier</h2>
        <button class="modal-close" data-close-modal="payment-modal">&times;</button>
      </div>
      <div id="payment-form-error"></div>
      <form id="payment-form">
        <div class="field-row">
          <div class="field">
            <label>Payment Date *</label>
            <input type="date" id="p-date" required>
          </div>
          <div class="field">
            <label>Amount (\u20b9) *</label>
            <input type="number" step="0.01" min="0.01" id="p-amount" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Payment Method *</label>
            <select id="p-method" required>
              <option value="CASH">Cash</option>
              <option value="UPI">UPI</option>
              <option value="BANK_TRANSFER">Bank Transfer</option>
              <option value="CHEQUE">Cheque</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
          <div class="field">
            <label>Reference Number</label>
            <input type="text" id="p-reference">
          </div>
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="p-notes" rows="2"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-outline" data-close-modal="payment-modal">Cancel</button>
          <button type="submit" class="btn-primary" id="payment-save-btn">Save Payment</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/supplier-detail.js"></script>
</body>
</html>
