<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers \u2013 Vijayalakshmi Poultry Farm</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="customers" data-title="Customers">
  <div id="page-content">
    <div class="toolbar">
      <div class="filters">
        <input type="text" id="search-box" placeholder="Search chicken center...">
      </div>
      <button class="btn-primary" id="add-customer-btn">+ Add Customer</button>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr><th>Chicken Center</th><th>Contact</th><th>Phone</th><th class="text-right">Opening Balance</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="customers-body"><tr><td colspan="6" class="table-empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Add/Edit Customer Modal -->
  <div class="modal-backdrop" id="customer-modal" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2 id="customer-modal-title">Add Customer</h2>
        <button class="modal-close" data-close-modal="customer-modal">&times;</button>
      </div>
      <div id="customer-form-error"></div>
      <form id="customer-form">
        <input type="hidden" id="c-id">
        <div class="field">
          <label>Chicken Center Name *</label>
          <input type="text" id="c-name" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Owner / Contact Person</label>
            <input type="text" id="c-contact">
          </div>
          <div class="field">
            <label>Phone Number</label>
            <input type="text" id="c-phone">
          </div>
        </div>
        <div class="field">
          <label>Address</label>
          <textarea id="c-address" rows="2"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Opening Balance (\u20b9)</label>
            <input type="number" step="0.01" min="0" id="c-opening-balance" value="0">
            <div class="hint" id="opening-balance-hint">Only used when creating a new customer.</div>
          </div>
          <div class="field">
            <label>Status</label>
            <select id="c-status">
              <option value="ACTIVE">Active</option>
              <option value="INACTIVE">Inactive</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="c-notes" rows="2"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-outline" data-close-modal="customer-modal">Cancel</button>
          <button type="submit" class="btn-primary" id="customer-save-btn">Save Customer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/customers.js"></script>
</body>
</html>
