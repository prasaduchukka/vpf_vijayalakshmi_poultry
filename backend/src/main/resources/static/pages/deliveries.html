<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deliveries \u2013 Vijayalakshmi Poultry Farm</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="deliveries" data-title="Deliveries / Sales">
  <div id="page-content">
    <div class="toolbar">
      <div class="filters">
        <label style="margin:0;">From</label>
        <input type="date" id="from-filter">
        <label style="margin:0;">To</label>
        <input type="date" id="to-filter">
        <button class="btn-outline btn-sm" id="apply-filter-btn">Filter</button>
      </div>
      <div class="filters">
        <button class="btn-outline" id="add-payment-btn">+ Record Payment</button>
        <button class="btn-primary" id="add-delivery-btn">+ Record Delivery</button>
      </div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Date</th><th>Customer</th><th>Birds</th><th>Dispatch Wt</th><th>Rate</th><th class="text-right">Amount</th><th></th></tr></thead>
        <tbody id="deliveries-body"><tr><td colspan="7" class="table-empty">Loading...</td></tr></tbody>
      </table>
      <div class="summary-line total" id="total-line" style="display:none;"></div>
    </div>
  </div>

  <!-- Record Delivery Modal -->
  <div class="modal-backdrop" id="delivery-modal" style="display:none;">
    <div class="modal wide">
      <div class="modal-header">
        <h2>Record Delivery</h2>
        <button class="modal-close" data-close-modal="delivery-modal">&times;</button>
      </div>
      <p class="hint" style="margin-bottom:12px;">Use <strong>Save &amp; Next</strong> to enter several deliveries one after another without closing this window.</p>
      <div id="delivery-session-list"></div>
      <div id="delivery-form-error"></div>
      <form id="delivery-form">
        <div class="field">
          <label>Customer *</label>
          <select id="d-customer" required></select>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Delivery Date *</label>
            <input type="date" id="d-date" required>
          </div>
          <div class="field">
            <label>Number of Birds (optional)</label>
            <input type="number" min="0" id="d-birds">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Dispatch Weight (kg) *</label>
            <input type="number" step="0.01" min="0" id="d-dispatch" required>
          </div>
          <div class="field">
            <label>Selling Rate (\u20b9/kg) *</label>
            <input type="number" step="0.01" min="0" id="d-rate" required>
          </div>
        </div>
        <div class="field">
          <label>Sales Amount (auto = Dispatch Weight \u00d7 Rate)</label>
          <input type="text" id="d-sales-amount" disabled>
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="d-notes" rows="2"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-outline" data-close-modal="delivery-modal">Close</button>
          <button type="button" class="btn-outline" id="delivery-save-next-btn">Save &amp; Next</button>
          <button type="submit" class="btn-primary" id="delivery-save-btn">Save &amp; Finish</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Record Payment Modal -->
  <div class="modal-backdrop" id="payment-modal" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2>Record Customer Payment</h2>
        <button class="modal-close" data-close-modal="payment-modal">&times;</button>
      </div>
      <div id="payment-form-error"></div>
      <form id="payment-form">
        <div class="field">
          <label>Customer *</label>
          <select id="p-customer" required></select>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Payment Date *</label>
            <input type="date" id="p-date" required>
          </div>
          <div class="field">
            <label>Amount (\u20b9) *</label>
            <input type="number" step="0.01" min="0.01" id="p-amount" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Payment Method *</label>
            <select id="p-method" required>
              <option value="CASH">Cash</option>
              <option value="UPI">UPI</option>
              <option value="BANK_TRANSFER">Bank Transfer</option>
              <option value="CHEQUE">Cheque</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
          <div class="field">
            <label>Reference Number</label>
            <input type="text" id="p-reference">
          </div>
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="p-notes" rows="2"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-outline" data-close-modal="payment-modal">Cancel</button>
          <button type="submit" class="btn-primary" id="payment-save-btn">Save Payment</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/deliveries.js"></script>
</body>
</html>
