<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses \u2013 Vijayalakshmi Poultry Farm</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="expenses" data-title="Expenses">
  <div id="page-content">
    <div class="toolbar">
      <div class="filters">
        <label style="margin:0;">From</label>
        <input type="date" id="from-filter">
        <label style="margin:0;">To</label>
        <input type="date" id="to-filter">
        <button class="btn-outline btn-sm" id="apply-filter-btn">Filter</button>
      </div>
      <button class="btn-primary" id="add-expense-btn">+ Add Expense</button>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="text-right">Amount</th><th></th></tr></thead>
        <tbody id="expenses-body"><tr><td colspan="5" class="table-empty">Loading...</td></tr></tbody>
      </table>
      <div class="summary-line total" id="total-line" style="display:none;"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="expense-modal" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2 id="expense-modal-title">Add Expense</h2>
        <button class="modal-close" data-close-modal="expense-modal">&times;</button>
      </div>
      <div id="expense-form-error"></div>
      <form id="expense-form">
        <input type="hidden" id="e-id">
        <div class="field-row">
          <div class="field">
            <label>Date *</label>
            <input type="date" id="e-date" required>
          </div>
          <div class="field">
            <label>Category *</label>
            <select id="e-category" required>
              <option value="DIESEL">Diesel</option>
              <option value="FOOD">Food</option>
              <option value="WETTING_WATER">Wetting Water</option>
              <option value="LOADING">Loading</option>
              <option value="UNLOADING">Unloading</option>
              <option value="TOLL">Toll</option>
              <option value="DRIVER_PAYMENT">Driver Payment</option>
              <option value="VEHICLE_EXPENSE">Vehicle Expense</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Amount (\u20b9) *</label>
          <input type="number" step="0.01" min="0.01" id="e-amount" required>
        </div>
        <div class="field">
          <label>Description</label>
          <input type="text" id="e-description">
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="e-notes" rows="2"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-outline" data-close-modal="expense-modal">Cancel</button>
          <button type="submit" class="btn-primary" id="expense-save-btn">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/expenses.js"></script>
</body>
</html>
